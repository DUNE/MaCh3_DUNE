name: PR Validation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu22.04, ubuntu25.10, alma9]
          
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.os }} image
        run: |
          docker buildx build \
            --file Docs/MaCh3DockerFiles/${{ matrix.os }}/Dockerfile \
            --tag mach3-ci-${{ matrix.os }} \
            --build-arg MACH3_DUNE_VERSION=${{ github.event.pull_request.head.sha }} \
            --load \
            .
        
      - name: Save image
        run: docker save mach3-ci-${{ matrix.os }} | gzip > ${{ matrix.os }}-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-image
          path: ${{ matrix.os }}-image.tar.gz

  ci-validations:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Beam Event Rate Validation
            test_exe: EventRates
            test_exe_args: CIValidations/CIInputs/CIFitConfig.yaml
            old_output: CIValidations/CIOutputs/BeamEventRates.txt
            new_output: CIValidations/CIOutputs/BeamEventRates_New.txt

          - name: Full Beam Event Rate Validation
            test_exe: EventRates
            test_exe_args: Configs/EventRates_Beam.yaml
            old_output: Docs/EventRates_Beam.log
            new_output: Docs/EventRates_Beam_New.log

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: alma9-image

      - name: Load image
        run: gunzip -c alma9-image.tar.gz | docker load

      - name: Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v4
        with:
          cvmfs_repositories: dune.osgstorage.org

      - uses: addnab/docker-run-action@v3
        with:
          image: mach3-ci-alma9
          options: "-v /cvmfs:/cvmfs:ro"
          run: |
            source build/bin/setup.MaCh3DUNE.sh
            ./Scripts/link_files.sh

            build/bin/${{ matrix.test_exe }} ${{ matrix.test_exe_args }} > ${{ matrix.new_output }}

            diff ${{matrix.old_output}} ${{matrix.new_output}} > diff_output.txt
            DIFF_EXIT=$?
            cat diff_output.txt
            if [ $DIFF_EXIT -gt 0 ]; then
              echo "Differences found:"
              exit 1
            else
              echo "Workflow run successfully, no differences found!"
            fi

      