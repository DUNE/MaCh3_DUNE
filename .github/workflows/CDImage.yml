---
# Update MaCh3 container image registry with newest updates
name: Image CD

# The events that trigger the workflow
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu22.04, ubuntu25.10, alma9]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build ${{ matrix.os }} image
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            docker build . \
              --file Docs/MaCh3DockerFiles/${{ matrix.os }}/Dockerfile \
              --tag "ghcr.io/dune/mach3:${{ matrix.os }}${{ github.ref_name }}" \
              --build-arg MACH3_DUNE_VERSION="${{ github.ref_name }}" \
              --build-arg MACH3_DUNE_BUILD_ARGS="-DCUDAProb3Linear_ENABLED=ON"
          else
            docker build . \
              --file Docs/MaCh3DockerFiles/${{ matrix.os }}/Dockerfile \
              --tag "ghcr.io/dune/mach3:${{ matrix.os }}latest" \
              --build-arg MACH3_DUNE_VERSION="develop" \
              --build-arg MACH3_DUNE_BUILD_ARGS="-DCUDAProb3Linear_ENABLED=ON"
          fi

      - name: Push Docker image
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            docker push "ghcr.io/dune/mach3:${{ matrix.os }}${{ github.ref_name }}"
          else
            docker push "ghcr.io/dune/mach3:${{ matrix.os }}latest"
          fi

      - name: Delete old images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55
        with:
          package-name: 'mach3'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'true'
