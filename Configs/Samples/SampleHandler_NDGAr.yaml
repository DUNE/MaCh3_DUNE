SampleHandlerName: "BeamNDGAr"
MaCh3ModeConfig: "Configs/CovObjs/MaCh3Modes_NEUT.yaml"
BinningFile: "Configs/Samples/BeamParameterBinning.yaml"
InputFiles:
  LoadSplineFile: false
  PrepSplineFile: false

DetectorVariables:
  TPCInstrumentedRadius: 260
  UsePseudoRadius: false
  PseudoRadius: 235
  TPCInstrumentedLength: 250
  B_field: 0.5
  interaction_model: "hA"
  nECALBackSegments: 0
  ECALBarrelForwardDepth: 10.4 # radiation lengths
  ECALBarrelBackwardDepth: 7.4 # radiation lengths
  ECALEndCapDepth: 10.4 # radiation lengths
  energy_resolution_threshold: 0.05
  pixel_spacing: 6. # mm
  spatial_resolution: 2.5 # mm
  adc_sampling_frequency: 20.
  drift_velocity: 3.011
  # Note that for 1t fid mass, need FidRad=200, FidLen=230 or FidRad=220, FidLen=180 for shorter geometry
  # For a purely acceptance-motivated cut, would use FidRad=160, FidLen=210 for pilot geometry
  TPCFidRadius: 200
  TPCFidLength: 230
  ECALSciX0: 0.892453
  downsampling: 1
  DoGeometricCorrection: false

Samples: ["NDGAr_FHC_numu"]

NDGAr_FHC_numu:
  SampleTitle: "NDGAr_FHC_numu"
  POT: 1.0e+21

  SelectionCuts:

  Binning:
    VarStr: "TrueNeutrinoEnergy"
    Uniform: true
    BinEdges: [0., 1., 1.5, 1.75, 2., 2.25, 2.5, 2.75, 3., 3.25, 3.5, 4., 5.]

  DUNESampleBools:
    iselike: no
    isFHC: 1

  InputFiles:
    mtupleprefix: "Inputs/DUNE_NDGAr_files/FastGArSim/rad260/len250/bfield0.5/hA/"
    # mtupleprefix: "Inputs/DUNE_NDGAr_files/hA/3M_BigCal_PbWO4Cal_"
    mtuplesuffix: ".root"
    splineprefix: ""
    splinesuffix: ""

  OscChannels:
  - Name: "FHC_CC_numu"
    LatexName: "FHC_CC_numu"
    mtuplefile: ["*"]
      # mtuplefile: "hA_*"
    splinefile: ""
    nutype: 14
    oscnutype: 14
