    "TruePip-Init_0-End_0", "TruePip-Init_1-End_0", "TruePip-Init_2-End_0", "TruePip-Init_Over-End_0",
    "TruePip-Init_1-End_1", "TruePip-Init_2-End_1", "TruePip-Init_Over-End_1",
    "TruePip-Init_2-End_2", "TruePip-Init_Over-End_2",
    "TruePip-Init_Over-End_Over"
  ]

  Decay : [
    "TrueDecay-Init_Under-End_Under", "TrueDecay-Init_0-End_Under", "TrueDecay-Init_1-End_Under", "TrueDecay-Init_2-End_Under", "TrueDecay-Init_Over-End_Under",
    "TrueDecay-Init_0-End_0", "TrueDecay-Init_1-End_0", "TrueDecay-Init_2-End_0", "TrueDecay-Init_Over-End_0",
    "TrueDecay-Init_1-End_1", "TrueDecay-Init_2-End_1", "TrueDecay-Init_Over-End_1",
