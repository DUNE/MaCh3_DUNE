SampleHandlerName: "OffAxisND"

SampleType: "OffAxisND"

MaCh3ModeConfig: "Configs/CovObjs/MaCh3Modes_GENIE.yaml"

BinningFile: "Configs/TutorialConfigs/TutorialBinning.yaml"


InputFiles:
  #CovarianceMatrix: ["bla.root", "NDCovMatrix"]

Samples: ["OffAxis0m_numuCC_numode_true"]

OffAxis0m_numuCC_numode_true:
  SampleTitle: "OffAxis0m_numuCC_numode_true"

  POT: 1.1e21
  is_numode: True

  SelectionCuts:
    - KinematicStr: "IsCC"
      Bounds: [0.5,1.5]

  Binning:
    VarStr : [ "TrueNeutrinoEnergy", "RecoNeutrinoEnergy"]
    VarBins: [[ { linspace: { nb: 60, low: 0.0, up: 10.0 } } ], [ { linspace: { nb: 60, low: 0.0, up: 10.0 } } ]]
    Uniform: True
  InputFiles:
    mtupleprefix: "/project/rpp-nilic/abipeake/PRISM_CAFs/FHC/"
    mtuplesuffix: ".root"
    splineprefix: "/home/abipeake/scratch/MaCh3DUNE_LukesVersion/MaCh3_DUNE/Analysis_splines/Reco_Truesplies/"
    splinesuffix: ".root"

  SubSamples:
    - Name: "OnAxis_numuCC_numode_true1"
      LatexName: "On Axis Numu CC Neutrino Mode"
      mtuplefile: "CAFv7_0m_13*"
      splinefile: #"OffAxis0m_numuCC_numode_true_splines"
