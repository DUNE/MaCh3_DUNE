SampleType: "OffAxisND"

MaCh3ModeConfig: "Configs/CovObjs/MaCh3Modes_GENIE.yaml"

BinningFile: "Configs/TutorialConfigs/TutorialBinning.yaml"

# NuOsc:
#   NuOscConfigFile: "Configs/NuOsc/NuFASTLinear.yaml"
#   EqualBinningPerOscChannel: true


