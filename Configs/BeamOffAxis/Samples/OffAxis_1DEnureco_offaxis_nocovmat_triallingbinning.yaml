# Off-axis ND sample config.
# Changed from the original: VarBins in every sample now use one common binning
# (40 bins, ~6-15% of E wide), so the peak of every off-axis position is resolved.
# Nothing else changed. Items flagged "# CHECK" below are unchanged but look unintended.

